[project]
name = "biological-sandbox"
version = "0.1.0"
description = "Stochastic biological models and the deterministic limits they collapse into — built validation-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boyko Neov", email = "boikoneov@gmail.com" }]
keywords = ["biology", "simulation", "wright-fisher", "stochastic", "education"]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 6: the suite is dominated by a few multi-minute convergence checks, so wall
# clock floors at the single longest test -- currently the repressilator slope check
# at 122 s. Reaching that floor takes enough workers that the *other* long tests
# never share one: the runners-up are 96 s (squared-Omega tooth), 27 s (fixed-Omega
# tooth) and 2x ~21 s (birth-death). This was `-n 4`, whose comment claimed four
# workers already reached the floor. That stopped being true once the 96 s tooth was
# added -- xdist packed 122 s + 96 s onto one worker and the suite took 277 s.
# Measured, same machine: -n 4 = 277 s, -n 6 = 129 s, -n 8 = 130 s. Six reaches the
# floor, so `-n auto` would claim all 16 cores for nothing. Combined with the
# below-normal priority set in tests/conftest.py, a full run stays polite to whatever
# else is on the machine. Use `-p no:xdist` or `-n 0` to run serially when debugging
# (parallel runs interleave output and hide `-s` prints).
addopts = "-ra -n 6"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, UP pyupgrade, B bugbear,
# SIM simplify, NPY numpy-specific lints.
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
