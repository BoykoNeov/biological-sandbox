[project]
name = "biological-sandbox"
version = "0.1.0"
description = "Stochastic biological models and the deterministic limits they collapse into — built validation-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boyko Neov", email = "boikoneov@gmail.com" }]
keywords = ["biology", "simulation", "wright-fisher", "stochastic", "education"]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -n 4: the suite is dominated by a handful of multi-minute convergence checks, so
# wall clock floors at the single longest test (~130 s). Four workers already reach
# that floor; `-n auto` would claim all 16 cores for no further gain. Combined with
# the below-normal priority set in tests/conftest.py, a full run stays polite to
# whatever else is on the machine. Use `-p no:xdist` or `-n 0` to run serially when
# debugging (parallel runs interleave output and hide `-s` prints).
addopts = "-ra -n 4"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, UP pyupgrade, B bugbear,
# SIM simplify, NPY numpy-specific lints.
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
