name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (3.11) through current stable. The ValidationSuite is the gate.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra viz --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Run the ValidationSuite (tests)
        run: uv run pytest -q
